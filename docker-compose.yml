services:
  # ─── Hermes Agent (Gateway + API Server) ─────────────────────────
  # Long-running process: messaging platforms, cron scheduler, and the
  # REST API server that the WebUI connects to.
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    command: ["gateway", "run"]
    env_file:
      - .env
    environment:
      # ── API server (required for WebUI to reach the agent) ────────
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"          # MUST be 0.0.0.0 in Docker
      # Set a strong API_SERVER_KEY in .env for any non-loopback exposure

      # ── Dashboard ────────────────────────────────────────────────
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_INSECURE: "false"   # set "true" on private LAN only

      # ── Gateway settings ─────────────────────────────────────────
      GATEWAY_ALLOW_ALL_USERS: "false"

      # ── Terminal backend (optional — pick one) ───────────────────
      # "local" = runs commands on the Docker host (needs docker.sock)
      # "docker" = spawns a dev container per command (sandboxed)
      # Uncomment and configure if you want sandboxed terminal execution:
      #
      # TERMINAL_ENV: "docker"
      # TERMINAL_DOCKER_IMAGE: "ghcr.io/your-org/dev-container:latest"
      # TERMINAL_DOCKER_RUN_AS_HOST_USER: "false"
      # TERMINAL_DOCKER_PERSIST_ACROSS_PROCESSES: "true"
      # TERMINAL_PERSISTENT_SHELL: "true"
      # TERMINAL_DOCKER_EXTRA_ARGS: '["--tmpfs=/workspace:rw,exec,size=10g,mode=1777,uid=1001,gid=1000","--tmpfs=/home/dev:rw,exec,size=1g,mode=1777,uid=1001,gid=1000"]'

      # ── SSH backend (preferred) ────────────────────────
      # When terminal.backend=ssh (config.yaml), the agent
      # SSHes into the dev-container service for every tool
      # call. Persistent state, no per-command container spin-up.
      #
      # Key path note: the bind-mounted /opt/data/yoav is owned
      # by uid 1000 (host yoav), but the gateway runs as hermes
      # (uid 10000). ssh refuses to load keys not readable by
      # the calling user, so we keep a hermes-owned copy at
      # /opt/data/.ssh/yoav. The first-run setup script in
      # data/agent-init/ creates it (see install-agent-init.sh).
      TERMINAL_SSH_HOST: "dev-container"
      TERMINAL_SSH_PORT: "22"
      TERMINAL_SSH_USER: "root"
      TERMINAL_SSH_KEY: "/opt/data/.ssh/yoav"

      # ── SSH client wrapper ────────────────────────────
      # /opt/data/bin/ssh intercepts ssh calls and injects
      # SendEnv flags directly via -o (works around the
      # bind-mount ownership problem with the ssh_config.d
      # include file). Prepend to PATH so it's found first.
      PATH: "/opt/data/bin:/opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

      # ── Firecrawl (web scraping backend) ─────────────────
      # Defaults to the in-network hostname when firecrawl is
      # started via `docker compose --profile firecrawl up -d`.
      # Override in .env if you run firecrawl elsewhere
      # (e.g. FIRECRAWL_API_URL=http://host.docker.internal:3002).
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-http://firecrawl-api:3002}

      # ── Camofox (browser automation backend) ─────────────
      # Defaults to the in-network hostname. Override in .env
      # if you run camofox elsewhere.
      CAMOFOX_URL: ${CAMOFOX_URL:-http://camofox-browser:3000}
      CAMOFOX_API_KEY: ${CAMOFOX_API_KEY:-change-me}
    volumes:
      - ./data:/opt/data
      - /var/run/docker.sock:/var/run/docker.sock:rw
      # Agent uses this to SSH into the dev-container.
      # The gateway runs as hermes (uid 10000) and ssh refuses to
      # load keys not readable by the calling user. The bind mount
      # brings the file in as uid 1000 (host yoav), so we keep
      # a hermes-owned copy at /opt/data/.ssh/yoav (see
      # install-agent-init.sh) and point TERMINAL_SSH_KEY there.
      - /home/your-user/hermes/yoav:/opt/data/yoav:ro
    ports:
      - "8642:8642"    # API server — used by WebUI
      - "9119:9119"    # Hermes dashboard
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets agent reach host services
    networks:
      - hermes-net
    depends_on:
      # Use service_started instead of service_healthy — if the
      # dev-container fails its health check, the agent still starts
      # and the WebUI works (terminal calls will just fail).
      dev-container:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8642/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Long-lived Dev Container (sandboxed shell + tools) ──────
  # Hermes agent SSHes into this container for every terminal call.
  # Replaces the per-command docker-spawn backend — same env, same
  # tools, but the container lives for the lifetime of the stack
  # so state (background processes, tmpfiles, network listeners)
  # persists across tool calls. Mount the host's yoav SSH key for
  # the agent → container auth, plus yoav.pub so the container can
  # auth OUT to tailnet hosts.
  dev-container:
    image: ghcr.io/phantomic12/dev-container:latest
    user: root
    init: true
    hostname: dev-container
    # Skip the image's entrypoint — it does `sudo chown dev:ubuntu /run/sshd`
    # which breaks sshd when we run as root. Run our own init that:
    # 1. Starts sshd with proper perms
    # 2. Sets up /workspace + /root state
    # 3. Sleeps forever (init: true keeps PID 1 healthy)
    command: ["/opt/dev-container-init.sh"]
    entrypoint: [""]
    env_file:
      - .env
    volumes:
      - ./dev-container-init.sh:/opt/dev-container-init.sh:ro
      # Auth: agent uses yoav (private) to SSH in; container uses yoav.pub
      # to SSH out to other tailnet hosts. Mounted as a directory so
      # the entrypoint can chmod it.
      - /home/your-user/hermes/dev-ssh:/root/.ssh
      # Persistent workspace + tooling storage
      - dev-workspace:/workspace
      - dev-home:/root
      - dev-cache:/root/.cache
    tmpfs:
      # Fast ephemeral scratch — gone on restart
      - /tmp:rw,exec,size=10g,mode=1777
    ports:
      # Direct access from the host (and tailnet) for debugging —
      # the agent talks to the container over the compose network
      # via SSH (port 22), not via this published port.
      - "2222:22"
    networks:
      - hermes-net
    restart: unless-stopped
    healthcheck:
      # ss/netstat aren't in the dev-container image. Use bash's
      # /dev/tcp probe — built into bash, no extra deps.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/22' && exec 3<&- 3>&- || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── Hermes Workspace (Web UI) ───────────────────────────────────
  # Browser-based chat interface. Proxies all LLM calls through the
  # hermes-agent container — never connects to the LLM directly.
  hermes-workspace:
    image: ghcr.io/nesquena/hermes-webui:latest
    # The webui entrypoint expects /opt/hermes-agent to be owned by its
    # runtime UID. This command pre-chowns it before the init script runs.
    command:
      - "bash"
      - "-c"
      - >-
        chown -R 10000:10000 /opt/hermes-agent &&
        chmod -R go-w /opt/hermes-agent &&
        exec /hermeswebui_init.bash
    env_file:
      - .env
    environment:
      # ── Storage paths ────────────────────────────────────────────
      HERMES_WEBUI_STATE_DIR: /opt/data
      HERMES_WEBUI_DEFAULT_WORKSPACE: /opt/data
      HERMES_HOME: /opt/data              # MUST match agent's data volume

      # ── Network: talk to the agent over Docker's internal network ─
      HERMES_API_URL: http://hermes-agent:8642
      HERMES_API_TOKEN: ${API_SERVER_KEY:-}

      # ── CRITICAL: gateway chat backend ────────────────────────────
      # Without these, the webui runs its own embedded agent (legacy
      # mode) which can't reach host.docker.internal and fails with
      # "Connection error" on every message send.
      HERMES_WEBUI_CHAT_BACKEND: "gateway"
      HERMES_WEBUI_GATEWAY_BASE_URL: "http://hermes-agent:8642"
      HERMES_WEBUI_GATEWAY_API_KEY: ${API_SERVER_KEY:-}

      # ── Agent source (for model auto-detect, CLI session import) ──
      HERMES_WEBUI_AGENT_DIR: /opt/hermes-agent

      # ── WebUI server ─────────────────────────────────────────────
      HERMES_WEBUI_PORT: "8787"

      # ── Auth (required for non-loopback) ──────────────────────────
      HERMES_WEBUI_PASSWORD: ${HERMES_WEBUI_PASSWORD:-}

      # ── Auto-install missing Python deps on first start ───────────
      HERMES_WEBUI_AUTO_INSTALL: "1"
    volumes:
      - ./data:/opt/data                  # shared state with the agent
      - ./agent-src:/opt/hermes-agent     # cloned hermes-agent source (writable)
    ports:
      - "3003:8787"                       # WebUI — change host port as needed
    depends_on:
      hermes-agent:
        condition: service_healthy
      # Don't block on dev-container being healthy — the workspace only
      # needs the agent. If dev-container is broken, terminal calls
      # fail but the rest of the WebUI still works.
      dev-container:
        condition: service_started
    restart: unless-stopped
    networks:
      - hermes-net

  # ─── Camofox Browser ───────────────────────────────────────────
  # Headless Chrome instance used by the agent's `browser` tool.
  # Single container, persistent cookie/profile state. The agent
  # reaches it at `http://camofox-browser:3000` from inside the
  # compose network.
  #
  # Put behind the `camofox` profile so `docker compose up -d`
  # doesn't auto-start it (the existing standalone camofox stack
  # uses port 9377 on the host — they conflict if both are up).
  # To migrate: stop the old container, then
  #   docker compose --profile camofox up -d camofox-browser
  # The volume (camofox-cookies) is reused to preserve state.
  #
  # CAMOFOX_API_KEY: any non-empty string is fine (the agent uses
  # Bearer auth — set to whatever you like, just match the agent's
  # browser.camofox.api_key config).
  camofox-browser:
    image: yourprojectname-camofox-browser:latest
    profiles: ["camofox"]
    hostname: camofox-browser
    environment:
      CAMOFOX_PORT: "3000"
      CAMOFOX_API_KEY: ${CAMOFOX_API_KEY:-change-me}
    volumes:
      - camofox-cookies:/home/node/.camofox/cookies
    ports:
      - "9377:3000"                      # exposed on host for debugging
    networks:
      - hermes-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000 && exec 3<&- 3>&- || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Firecrawl ─────────────────────────────────────────────────
  # Web scraper/crawler used by the agent's `web` tool (default
  # `web.backend: firecrawl`). Full stack: API + postgres + redis +
  # rabbitmq + playwright microservice. Put behind the `firecrawl`
  # profile so `docker compose up -d` doesn't auto-start it (use
  # `docker compose --profile firecrawl up -d` when you want it).
  firecrawl-postgres:
    image: firecrawl-nuq-postgres:latest
    profiles: ["firecrawl"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - firecrawl-postgres-data:/var/lib/postgresql/data
    networks:
      - hermes-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  firecrawl-redis:
    image: redis:alpine
    profiles: ["firecrawl"]
    networks:
      - hermes-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  firecrawl-rabbitmq:
    image: rabbitmq:3-management
    profiles: ["firecrawl"]
    networks:
      - hermes-net
    restart: unless-stopped

  firecrawl-playwright:
    image: firecrawl-playwright-service:latest
    profiles: ["firecrawl"]
    networks:
      - hermes-net
    restart: unless-stopped

  firecrawl-api:
    image: firecrawl-api:latest
    profiles: ["firecrawl"]
    depends_on:
      firecrawl-postgres:
        condition: service_healthy
      firecrawl-redis:
        condition: service_healthy
    environment:
      PORT: "3002"
      HOST: "0.0.0.0"
      ENV: "local"
      # In-network service hostnames
      POSTGRES_HOST: "firecrawl-postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "postgres"
      REDIS_URL: "redis://firecrawl-redis:6379"
      REDIS_RATE_LIMIT_URL: "redis://firecrawl-redis:6379"
      PLAYWRIGHT_MICROSERVICE_URL: "http://firecrawl-playwright:3000/scrape"
      USE_DB_AUTHENTICATION: "false"
      # Optional LLM for extraction — fill in if you use /scrape with
      # LLM extraction. OpenAI-compatible.
      OPENAI_API_KEY: ${FIRECRAWL_OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${FIRECRAWL_OPENAI_BASE_URL:-}
      MODEL_NAME: ${FIRECRAWL_MODEL_NAME:-}
    ports:
      - "3002:3002"
    networks:
      - hermes-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3002' && exec 3<&- 3>&- || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  ingest:
  dev-workspace:
  dev-home:
  dev-cache:
  camofox-cookies:
  firecrawl-postgres-data:

networks:
  hermes-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.0.0/24
